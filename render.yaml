services:
  - type: web
    name: appixo-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: appixo-db
          property: connectionString
      - key: DEFAULT_ADMIN_USER
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123

databases:
  - name: appixo-db
    plan: free
    databaseName: appixo
    user: appixo
